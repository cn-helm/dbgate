{{- if not .Values.auth.existingSecret }}
{{- $password := required "auth.adminPassword is required when auth.existingSecret is empty" .Values.auth.adminPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dbgate.authSecretName" . }}
  labels:
    {{- include "dbgate.labels" . | nindent 4 }}
type: Opaque
stringData:
  LOGIN_PASSWORD_admin: {{ $password | quote }}
  LOGIN_PERMISSIONS_admin: {{ .Values.auth.adminPermissions | quote }}
{{- end }}
