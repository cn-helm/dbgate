replicaCount: 1

image:
  repository: public.ecr.aws/cnoo/dbgate
  tag: "6.5.4"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  # Match Rancher's HTTP Service Proxy convention: Service port 80 -> DbGate 3000.
  port: 80
  targetPort: 3000
  annotations: {}

ingress:
  # Default Rancher ingress: https://<rancher-host-or-lan-ip>/dbgate/.
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    # Omit host to match localhost, a LAN IP, or any DNS name.
    - paths:
        - path: /dbgate
          pathType: Prefix
  tls: []

web:
  # DbGate is served below the default Ingress path prefix.
  root: "/dbgate"

auth:
  # Required unless existingSecret is set. Do not commit a real password here.
  adminPassword: ""
  adminPermissions: "*"
  # Existing Secret must contain LOGIN_PASSWORD_admin and LOGIN_PERMISSIONS_admin.
  existingSecret: ""

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  storageClass: ""
  annotations: {}

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
