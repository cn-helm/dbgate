replicaCount: 1

image:
  repository: cn00/dbgate
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  # Match Rancher's HTTP Service Proxy convention: Service port 80 -> DbGate 3000.
  port: 80
  targetPort: 3000
  annotations: {}

ingress:
  # Default Rancher ingress: https://<rancher-host-or-lan-ip>/dbgate/.
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    # Omit host to match localhost, a LAN IP, or any DNS name.
    - paths:
        - path: /dbgate
          pathType: Prefix
  tls: []

web:
  # DbGate is served below the default Ingress path prefix.
  root: "/dbgate"

auth:
  # logins, oauth or ad. OAuth/AD settings must be supplied by existingSecret.
  provider: logins
  # Required unless existingSecret is set. Do not commit a real password here.
  adminPassword: ""
  adminPermissions: "*"
  # Existing Secret must contain LOGIN_PASSWORD_admin and LOGIN_PERMISSIONS_admin.
  existingSecret: ""

rbac:
  # env preserves LOGIN_PERMISSIONS_*; postgres/mysql/sqlite enable dynamic RBAC.
  # Requires an application image containing the RBAC storage implementation.
  engine: env
  # PG/MySQL: Secret containing RBAC_STORAGE_PASSWORD and RBAC_TOKEN_SECRET.
  # SQLite: optional Secret containing RBAC_TOKEN_SECRET (at least 32 characters).
  # Secrets must exist in the release namespace. No credentials are stored here.
  existingSecret: ""
  bootstrap:
    # First initialization only; defaults to auth.provider when empty.
    provider: ""
    # Must be a real identity of the configured authentication provider.
    # Set to empty after initialization to omit both bootstrap variables.
    login: admin
  database:
    server: ""
    # 0 selects 5432 for postgres or 3306 for mysql.
    port: 0
    name: dbgate_rbac
    user: dbgate_rbac
    # true enables TLS with certificate verification.
    ssl: false
  sqlite:
    # Must be a file directly under the existing data volume mount.
    # Requires persistence.enabled=true and replicaCount=1; upgrades use Recreate.
    file: /root/.dbgate/rbac.sqlite

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  storageClass: ""
  annotations: {}

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
