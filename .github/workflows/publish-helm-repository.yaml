name: Publish Helm repository

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - readme.zh.md
      - docs/**
      - Chart.yaml
      - values.yaml
      - values.schema.json
      - tests/**
      - templates/**
      - .helmignore
      - .github/workflows/publish-helm-repository.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: helm-repository
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out chart source
        uses: actions/checkout@v4

      - name: Check out existing repository artifacts
        id: existing_repository
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .helm-repository

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate chart and RBAC templates
        shell: bash
        run: |
          set -euo pipefail
          helm lint . --strict --set auth.existingSecret=lint-auth
          node --test tests/rbac.test.cjs

      - name: Package chart and update index
        shell: bash
        run: |
          set -euo pipefail
          repository_dir=.helm-repository
          repository_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

          mkdir -p "${repository_dir}"
          helm package . --destination "${repository_dir}"

          if [[ -f "${repository_dir}/index.yaml" ]]; then
            helm repo index "${repository_dir}" \
              --url "${repository_url}" \
              --merge "${repository_dir}/index.yaml"
          else
            helm repo index "${repository_dir}" --url "${repository_url}"
          fi

      - name: Set up Python for documentation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render English and Chinese documentation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r docs/requirements.txt
          python -m unittest discover -s docs -p 'test_*.py' -v
          python docs/render.py --output .helm-repository

      - name: Publish repository to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .helm-repository
